[package]
name = "rnn-training"
version = "0.1.0"
edition = "2024"
default-run = "rnn-training"

[dependencies]
axum = "0.8"
ndarray = "0.17.2"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
